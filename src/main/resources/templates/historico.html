<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layoutAdmin :: base(~{::main})}">
    <head>
        <title>Historico</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>

        <main class="py-4">

            <!---------------------- TABELA CLOSE ---------------------->
            <div class="card shadow-sm p-4 mb-4 border-danger">
                <h3 class="mb-4 fw-bold" style="color: #0e7490;">Historico De Liberações</h3>
                
                <!-- FILTROS -->
                <div class="row mb-4 g-3 bg-light p-3 rounded border">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Filtrar por Operador:</label>
                        <select id="filtroOperador" class="form-select">
                            <option value="">Todos os Operadores</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Filtrar por Equipamento:</label>
                        <select id="filtroEquipamento" class="form-select">
                            <option value="">Todos os Equipamentos</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Filtrar por Data (Retirada):</label>
                        <!-- input type="date" sempre gera valores no formato YYYY-MM-DD -->
                        <input type="date" id="filtroData" class="form-control">
                    </div>
                </div>  
                

                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Operador</th>
                                <th scope="col">Equipamento</th>
                                <th scope="col">Retirada</th>
                                <th scope="col">Devolução</th>
                                <th scope="col"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="l : ${close}">
                                <td class="fw-bold" th:text="${l.id}">1</td>
                                <td th:text="${l.nomeOp}">Nome do Operador</td>
                                <td th:text="${l.nomeEquip}">Nome do Equipamento</td>
                                <td th:text="${#temporals.format(l.dataHoraRetiradaReal, 'dd/MM/yyyy HH:mm')}">01/01/2000 00:00</td>
                                <td th:text="${#temporals.format(l.dataHoraDevolucaoReal, 'dd/MM/yyyy HH:mm')}">01/01/2000 00:00</td>
                                
                                <td>
                                    <button class="badge bg-secondary text-light border-0 px-2 py-1 fw-bold"
                                            type="button"
                                            data-bs-toggle="modal"
                                            th:data-bs-target="'#modalInfoLiberacao' + ${l.id}">
                                        INFO
                                    </button>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(close)}">
                                <td colspan="6" class="text-center text-muted py-4">
                                    Nenhum registro encontrado no histórico.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!---------------------- JANELA OCULTA 1 ---------------------->
            <th:block th:each="l : ${close}">
                <div class="modal fade" th:id="'modalInfoLiberacao' + ${l.id}" tabindex="-1" aria-hidden="true">
                    <!-- max-width 800px -->
                    <div class="modal-dialog modal-dialog-centered modal-lg" style="max-width: 800px;">
                        <div class="modal-content">
                            
                            <div class="modal-header text-white" style="background-color: #0e7490;">
                                <h5 class="modal-title fw-bold">Informações da Liberação</h5>
                                <button type="button" class="btn-close btn-close-white" 
                                        data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>

                            <div class="modal-body row g-3 text-start">

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Operador:</label>
                                    <input type="text" class="form-control bg-light" th:value="${l.nomeOp}" readonly>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Equipamento:</label>
                                    <input type="text" class="form-control bg-light" th:value="${l.nomeEquip}" readonly>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold text-muted">Retirada (Agendada):</label>
                                    <input type="text" class="form-control bg-light" th:value="${l.dataHoraRetirada}" readonly>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold text-muted">Devolução (Agendada):</label>
                                    <input type="text" class="form-control bg-light" th:value="${l.dataHoraDevolucao}" readonly>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold text-primary">Retirada (Real):</label>
                                    <input type="text" class="form-control bg-light border-primary" th:value="${l.dataHoraRetiradaReal}" readonly>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold text-primary">Devolução (Real):</label>
                                    <input type="text" class="form-control bg-light border-primary" th:value="${l.dataHoraDevolucaoReal}" readonly>
                                </div>

                                <div class="col-md-3">
                                    <label class="form-label fw-semibold">Hor. Inicial:</label>
                                    <input type="text" class="form-control bg-light" th:value="${l.horimetroInicial}" readonly>
                                </div>

                                <div class="col-md-3">
                                    <label class="form-label fw-semibold">Hor. Final:</label>
                                    <input type="text" class="form-control bg-light" th:value="${l.horimetroFinal}" readonly>
                                </div>

                                <div class="col-md-3">
                                    <label class="form-label fw-semibold">Comb. Inicial:</label>
                                    <input type="text" class="form-control bg-light" th:value="${l.combustivelInicial + '%'}" readonly>
                                </div>

                                <div class="col-md-3">
                                    <label class="form-label fw-semibold">Comb. Final:</label>
                                    <input type="text" class="form-control bg-light" th:value="${l.combustivelFinal + '%'}" readonly>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-semibold">Local de Uso:</label>
                                    <input type="text" class="form-control bg-light" th:value="${l.localUso}" readonly>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Observações de Retirada:</label>
                                    <textarea class="form-control bg-light" rows="3" th:text="${l.observacoesRetirada}" readonly></textarea>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold text-danger">Observações de Devolução (Problema):</label>
                                    <textarea class="form-control bg-light border-danger" rows="3" th:text="${l.observacoesDevolucao}" readonly></textarea>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </th:block>

        </main>
    </body>
</html>
