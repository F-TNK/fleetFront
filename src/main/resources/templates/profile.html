<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layoutOp :: base(~{::main})}">
    <head>
        <title>Meu Perfil</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    
    <body>
        <main class="d-flex justify-content-center align-items-center w-100 py-4" style="min-height: 80vh;">
            
            <div class="card shadow border-0 w-100" style="max-width: 600px; border-radius: 40px; overflow: hidden;">
                
                <div class="card-header text-white text-center py-3" style="background-color: #0e7490; border-radius: 40px 40px 0 0;">
                    <h2 class="mb-0">MEU PERFIL</h2>
                </div>
                
                <div class="card-body p-4">

                    <form th:action="@{/profile/edit}" th:object="${user}" method="POST">
                        
                        <!-- ID e cargo oculto -->
                        <input type="hidden" th:field="*{idUser}">
                        <input type="hidden" th:field="*{cargo}">

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Nome:</label>
                                    <input type="text" th:field="*{nome}" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">CPF:</label>
                                    <input type="text" th:field="*{cpf}" class="form-control" maxlength="14" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Data de Nascimento:</label>
                                    <input type="date" th:field="*{dataNascimento}" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Telefone:</label>
                                    <input type="text" th:field="*{telefone}" class="form-control" maxlength="15" required>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Endereço:</label>
                                    <input type="text" th:field="*{endereco}" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">E-mail:</label>
                                    <input type="email" th:field="*{email}" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Nova Senha (Opcional):</label>
                                    <input type="password" th:field="*{senha}" class="form-control">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Confirmar Nova Senha:</label>
                                    <input type="password" th:field="*{confirmSenha}" class="form-control">
                                </div>
                            </div>
                        </div>

                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-outline-primary btn-lg px-5 rounded-pill shadow-sm fw-bold">
                                Salvar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </body>
</html>
