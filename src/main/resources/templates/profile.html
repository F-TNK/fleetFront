<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layoutOp :: base(~{::main})}">
    <head>
        <title>Meu Perfil</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    
    <body>
        <main class="d-flex justify-content-center align-items-center w-100 py-2">
            
            <div class="card shadow border-0 w-100" 
                 style="max-width: 650px; border-radius: 40px; overflow: hidden; 
                 position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%); z-index: 1000;">
                <!-- centralizacao horizontal ignorando a navbar -->
                
                <div class="card-header text-white justify-content-center py-3" style="background-color: #0e7490;">
                    <h2 class="mb-0 fw-bold">MEU PERFIL</h2>
                </div>
                
                <div class="card-body p-4">

                    <form th:action="@{/profile/edit}" th:object="${user}" method="POST">
                        
                        <input type="hidden" th:field="*{idUser}">
                        <input type="hidden" th:field="*{cargo}">

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Nome:</label>
                                    <input type="text" th:field="*{nome}" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">CPF:</label>
                                    <input type="text" th:field="*{cpf}" class="form-control" maxlength="14" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Data de Nascimento:</label>
                                    <input type="date" th:field="*{dataNascimento}" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Telefone:</label>
                                    <input type="text" th:field="*{telefone}" class="form-control" maxlength="15" required>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Endereço:</label>
                                    <input type="text" th:field="*{endereco}" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">E-mail:</label>
                                    <input type="email" th:field="*{email}" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Senha:</label>
                                    <input type="password" 
                                           th:field="*{senha}" 
                                           class="form-control" 
                                           minlength="8" 
                                           required 
                                           oninvalid="this.setCustomValidity('A senha deve conter no mínimo 8 caracteres.')"
                                           oninput="this.setCustomValidity('')">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Confirmar Nova Senha:</label>
                                    <input type="password" th:field="*{confirmSenha}" class="form-control" required>
                                </div>
                            </div>
                        </div>

                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-primary btn-lg px-5 rounded-pill shadow-sm fw-bold">
                                Salvar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </body>
</html>
