<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: base(~{::main})}">
    <head>
        <title>Login</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    
    <body>
        
        <main class="w-100" style="min-height: 80vh;">
            
            <div class="card shadow border-0 w-100" 
                 style="max-width: 500px; border-radius: 40px; overflow: hidden; 
                 position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%); z-index: 1000;">
                <!-- centralizacao horizontal ignorando a navbar -->
            
                <!-- HEADER -->
                <div class="card-header text-white justify-content-center py-3" style="background-color: #0e7490;">
                    <h2 class="mb-0">LOGIN</h2>
                </div>
                <div class="card-body p-4">

                    <!------------------- Mensagem de erro ------------------->
                    <div th:if="${erro}" class="alert alert-danger" role="alert">
                       <span th:text="${erro}"></span>
                    </div>

                    <!------------------------- CARD ------------------------->
                    <form th:action="@{/logar}" method="post">

                        <div class="mx-auto" style="max-width: 250px;">
                            <div class="mb-3">
                                <label class="form-label text-center w-100">E-mail:</label>
                                <input type="email" name="email" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-center w-100">Senha:</label>
                                <input type="password" name="senha" class="form-control" required>
                            </div>
                        </div>
                        
                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-outline-primary btn-lg px-5 rounded-pill shadow-sm">Entrar</button>
                            <div class="text-center mt-3">
                                <a th:href="@{/register}" class="text-decoration-none">Não tem uma conta? Cadastre-se</a>
                            </div>
                        </div>

                    </form>
                </div>
            </div>
        </main>
    </body>
</html>
