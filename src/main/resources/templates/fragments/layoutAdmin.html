<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:fragment="base(conteudo)">
    <head>
        <meta charset="UTF-8">
        <title>Fleet - Gestão de Frota</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!-- Tabler template CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
        <!-- Tabler sticker/icones -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
        
        <style>
            /* Definindo cores globais */
            :root {
                --tblr-primary: #0c8bad;
                --tblr-primary-rgb: 12, 139, 173;
                
                --tblr-secondary: #6c757d;
                --tblr-secondary-rgb: 108, 117, 125;
                
                --tblr-warning: #FF8C00;
                --tblr-warning-rgb: 255, 140, 0;
                
                --tblr-danger: #FF0000;
                --tblr-danger-rgb: 255, 0   , 0;

                /* Fundo da Página */
                --tblr-body-bg: #f8fafc
;            }
            
            /* 1. AUTOMAÇÃO DO DARK MODE: Altera a cor primária globalmente no tema escuro */
            [data-bs-theme="dark"] {
                --tblr-primary: #38bdf8; /* Azul/Ciano claro com alto contraste */
                --tblr-primary-rgb: 56, 189, 248;
                
                --tblr-secondary: #94a3b8; /* Tom mais claro para manter boa leitura no fundo escuro */
                --tblr-secondary-rgb: 148, 163, 184;
            }

            a:not(.btn) { 
                color: var(--tblr-primary); 
            }

            /* sidebar colapsavel */
            @media (min-width: 800px) {
                .navbar-vertical {
                    width: 4.5rem !important;
                    transition: width 0.25s ease-in-out;
                    overflow: hidden;
                    white-space: nowrap;
                }

                .navbar-vertical .nav-link-title, 
                .navbar-vertical .navbar-brand {
                    opacity: 0;
                    transition: opacity 0.2s ease;
                }

                .navbar-vertical:hover {
                    width: 13rem !important;
                }

                .navbar-vertical:hover .nav-link-title,
                .navbar-vertical:hover .navbar-brand {
                    opacity: 1;
                }
            }

            /* Sombras */
            .card, .navbar, .modal-content {
                box-shadow: 4px 8px 16px rgba(0, 0, 0, 0.08) !important;
            } 
            
            /* Sombra colorida discreta no Dark Mode */
            [data-bs-theme="dark"] .card,
            [data-bs-theme="dark"] .navbar,
            [data-bs-theme="dark"] .modal-content {
                /* 0px deslocamento X, 4px deslocamento Y, 20px dispersão, azul original com 20% de opacidade */
                box-shadow: 0 4px 20px rgba(14, 116, 144, 0.2) !important;
            }

            /* Opcional: Efeito hover sutil nos cards durante o Dark Mode */
            [data-bs-theme="dark"] .card:hover {
                box-shadow: 0 6px 24px rgba(14, 116, 144, 0.35) !important;
                transition: box-shadow 0.2s ease-in-out;
            }
            
            [data-bs-theme="dark"] .form-select,
            [data-bs-theme="dark"] .form-control,
            [data-bs-theme="dark"] select option {
                background-color: #1e293b !important;
                color: #f8fafc !important;
                border-color: #334155 !important;
            }

            [data-bs-theme="dark"] select option:checked,
            [data-bs-theme="dark"] select option:hover {
                background-color: var(--tblr-primary) !important;
                color: #ffffff !important;
            }

            /* Força caixas com bg-light a acompanharem o modo escuro */
            [data-bs-theme="dark"] .bg-light {
                background-color: #0f172a !important;
                color: #f8fafc !important;
                border-color: #334155 !important;
            }
            
        </style>
    </head>
    
    <body class="page">
        
        <!---------------------- NAVBAR ---------------------->
        <aside class="navbar navbar-vertical navbar-expand-lg navbar-dark" style="background-color: #0e7490;">
            <div class="container-fluid d-flex flex-column h-100 py-3">

                <!-- Logo e Dark Mode -->
                <div class="d-flex align-items-center justify-content-between w-100 px-2 mb-3">
                    <a class="navbar-brand text-uppercase fw-bold text-white mb-0" th:href="@{/admin}">FLEET</a>
                    <button type="button" onclick="toggleDarkMode()" class="btn btn-icon btn-ghost-light" title="Alternar Tema">
                        <i class="ti ti-moon"></i>
                    </button>
                </div>
                
                <div class="collapse navbar-collapse show w-100 align-items-start" id="sidebar-menu">
                    <ul class="navbar-nav w-100 px-4">
                        <li class="nav-item">
                            <a class="nav-link text-white text-uppercase fw-semibold" th:href="@{/admin}">
                                <span class="nav-link-title">Listas</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white text-uppercase fw-semibold" th:href="@{/liberacoes}">
                                <span class="nav-link-title">Liberações</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white text-uppercase fw-semibold" th:href="@{/historico}">
                                <span class="nav-link-title">Histórico</span>
                            </a>
                        </li>
                    </ul>
                </div>

                <!-- rodape -->
                <div class="mt-auto w-100 px-2 pt-3">
                    <a th:href="@{/logout}" class="btn btn-outline-light w-100 d-flex align-items-center justify-content-center gap-2">
                        <span>Sair</span>
                    </a>
                </div>

            </div>
        </aside>

        <!---------------------- TELA ---------------------->
        <div class="page-wrapper">
            <div class="container-xl py-4">
                <!-- Mensagens ERRO e SUCESSO globais -->
                <div th:if="${erro != null}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
                    <strong>Falha!</strong> <span th:text="${erro}">Mensagem de erro</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div th:if="${sucesso != null}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
                    <span th:text="${sucesso}">Operação realizada com sucesso!</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- injeção das outras telas -->
                <div th:replace="${conteudo}"></div>
            </div>
        </div>
        
        <!-- Tabler JS -->
        <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>

        <!-- script DARK MODE -->
        <script>
            function toggleDarkMode() {
                const currentTheme = document.body.getAttribute('data-bs-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                document.body.setAttribute('data-bs-theme', newTheme);
                localStorage.setItem('fleet-theme', newTheme);
            }

            document.addEventListener("DOMContentLoaded", function() {
                const savedTheme = localStorage.getItem('fleet-theme') || 'light';
                document.body.setAttribute('data-bs-theme', savedTheme);
            });
        </script>
        
        <!-- FILTROS E TOOLTIP -->
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                const conteineres = document.querySelectorAll(".card");

                conteineres.forEach(container => {
                    const tableBody = container.querySelector(".table-responsive table tbody");
                    const selectOperador = container.querySelector(".filtro-operador");
                    const selectEquipamento = container.querySelector(".filtro-equipamento");
                    const inputData = container.querySelector(".filtro-data");

                    if (!tableBody || !selectOperador || !selectEquipamento || !inputData) return;

                    const rows = tableBody.querySelectorAll("tr:not(:last-child:has(td[colspan]))");
                    let operadoresUnicos = new Set();
                    let equipamentosUnicos = new Set();

                    rows.forEach(row => {
                        const cols = row.querySelectorAll("td");
                        if(cols.length > 2) {
                            operadoresUnicos.add(cols[1].innerText.trim());
                            equipamentosUnicos.add(cols[2].innerText.trim());
                        }
                    });

                    [...operadoresUnicos].sort().forEach(op => selectOperador.add(new Option(op, op)));
                    [...equipamentosUnicos].sort().forEach(eq => selectEquipamento.add(new Option(eq, eq)));

                    function aplicarFiltros() {
                        const filtroOp = selectOperador.value;
                        const filtroEq = selectEquipamento.value;
                        const filtroDt = inputData.value;

                        rows.forEach(row => {
                            const cols = row.querySelectorAll("td");
                            if(cols.length < 4) return;

                            const opNome = cols[1].innerText.trim();
                            const eqNome = cols[2].innerText.trim();
                            const dataStringText = cols[3].innerText.trim(); 

                            let dataFormatada = "";
                            if(dataStringText) {
                                const dataPart = dataStringText.split(' ')[0]; 

                                if (dataPart.includes('/')) {
                                    const [dia, mes, ano] = dataPart.split('/');
                                    dataFormatada = `${ano}-${mes.padStart(2, '0')}-${dia.padStart(2, '0')}`;
                                } else if (dataPart.includes('-')) {
                                    dataFormatada = dataPart;
                                }
                            }

                            const exibeOp = (filtroOp === "" || opNome === filtroOp);
                            const exibeEq = (filtroEq === "" || eqNome === filtroEq);
                            const exibeDt = (filtroDt === "" || dataFormatada === filtroDt);

                            if (exibeOp && exibeEq && exibeDt) {
                                row.style.display = ""; 
                            } else {
                                row.style.display = "none"; 
                            }
                        });
                    }

                    selectOperador.addEventListener("change", aplicarFiltros);
                    selectEquipamento.addEventListener("change", aplicarFiltros);
                    inputData.addEventListener("change", aplicarFiltros);
                });

                // Tooltip
                const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
                if (typeof bootstrap !== 'undefined') {
                    [...tooltipTriggerList].forEach(el => new bootstrap.Tooltip(el));
                }
            });
        </script>
    </body>
</html>
