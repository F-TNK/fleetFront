<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:fragment="base(conteudo)">
    <head>
        <meta charset="UTF-8">
        <title>Fleet - Gestão de Frota</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    </head>
    
    
    <body class="bg-light">
        
        <!---------------------- NAVBAR ---------------------->
        <nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: #0e7490;" data-bs-theme="dark">
            <div class="container-fluid">

                <span class="navbar-brand mb-0 h1 fs-4 fw-bold text-uppercase px-2" 
                      style="letter-spacing: 3px;">FLEET</span>
                <div class="collapse navbar-collapse" id="navbarFleet">
                    <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                        <li class="nav-item px-2">
                            <a class="nav-link text-white text-uppercase fw-semibold" 
                               aria-current="page" th:href="@{/admin}">Listas</a>
                        </li>
                        <li class="nav-item">
                            <span class="nav-link text-white display-1 fw-semibold" 
                               aria-current="page" th:href="@{/}">|</span>
                        </li>
                        <li class="nav-item px-2">
                            <a class="nav-link text-white text-uppercase fw-semibold" 
                               aria-current="page" th:href="@{/liberacoes}">Liberações</a>
                        </li>
                        <li class="nav-item">
                            <span class="nav-link text-white display-1 fw-semibold" 
                               aria-current="page" th:href="@{/}">|</span>
                        </li>
                        <li class="nav-item px-2">
                            <a class="nav-link text-white text-uppercase fw-semibold" 
                               aria-current="page" th:href="@{/historico}">Histórico</a>
                        </li>
                        <li class="nav-item">
                            <span class="nav-link text-white display-1 fw-semibold" 
                               aria-current="page" th:href="@{/}">|</span>
                        </li>
                        <li class="nav-item px-2">
                            <a class="nav-link text-white text-uppercase fw-semibold" 
                               aria-current="page" th:href="@{/busca}">Busca</a>
                        </li>
                    </ul>
                    <div class="d-flex gap-2">
                        <a th:href="@{/logout}" class="btn btn-outline-light">Sair</a>
                    </div>
                    
                </div>
            </div>
        </nav>
        
        <!-- injecao das outras telas -->
        <div class="container">
            <div th:replace="${conteudo}"></div>
        </div>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        
        <!---------------------- Balao Flutuante ---------------------->
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
                [...tooltipTriggerList].forEach(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl));
            });
        </script>
    </body>
</html>
