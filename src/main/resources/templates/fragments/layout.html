<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:fragment="base(conteudo)">
    <head>
        <meta charset="UTF-8">
        <title>Fleet - Gestão de Frota</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    </ul>
                    
                    <div class="d-flex gap-2">
                        <a th:href="@{/login}" class="btn btn-outline-light">Entrar</a>
                        <a th:href="@{/register}" class="btn btn-outline-light">Criar Conta</a>
                    </div>
                    
                </div>

        <div class="container">
            <!-- injecao das outras telas -->
            <div th:replace="${conteudo}"></div>
        </div>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
