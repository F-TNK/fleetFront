<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layoutOp :: base(~{::main})}">
    <head>
        <title>Liberações Op</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>

        <main class="py-4">

            <!---------------------- MINHAS LIBERACOES ---------------------->
            <div class="card shadow-sm p-4 mb-4 border-primary">
                <h3 class="mb-4 fw-bold" style="color: #0e7490;">Minhas Liberações</h3>

                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Equipamento</th>
                                <th scope="col">Retirada</th>
                                <th scope="col">Devolução</th>
                                <th scope="col">Status</th>
                                <th scope="col"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="l : ${liberacoes}">
                                <td class="fw-bold" th:text="${l.id}">1</td>
                                <td th:text="${l.nomeEquip}">Nome Equipamento</td>
                                <td th:text="${#temporals.format(l.dataHoraRetirada, 'dd/MM/yyyy HH:mm')}">01/01/2000 00:00</td>
                                <td th:text="${#temporals.format(l.dataHoraDevolucao, 'dd/MM/yyyy HH:mm')}">01/01/2000 00:00</td>
                                <td>
                                    <span th:if="${l.dataHoraRetiradaReal != null}" 
                                          class="badge bg-success text-light">Em Uso</span>
                                    <!-- dataHoraRetiradaReal == null e dataHoraRetirada no passado -->
                                    <span th:if="${l.dataHoraRetiradaReal == null and !l.dataHoraRetirada.isAfter(#temporals.createNow())}" 
                                          class="badge bg-warning text-dark">Aguardando</span>
                                    <span th:if="${l.dataHoraRetiradaReal == null and l.dataHoraRetirada.isAfter(#temporals.createNow())}" 
                                          class="badge bg-primary text-light">Aberta</span>
                                </td>
                                <td>
                                    <button class="badge bg-secondary text-light border-0 px-2 py-1 fw-bold"
                                            type="button"
                                            data-bs-toggle="modal"
                                            th:data-bs-target="'#modalOpLiberacao' + ${l.id}">
                                        INFO
                                    </button>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(liberacoes)}">
                                <td colspan="6" class="text-center text-muted py-4">
                                    Nenhuma liberação pendente encontrada.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!---------------------- JANELA OCULTA 1 ---------------------->
            <th:block th:each="l : ${liberacoes}">
                <div class="modal fade" th:id="'modalOpLiberacao' + ${l.id}" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered modal-lg" style="max-width: 800px;">
                        <div class="modal-content">
                            
                            <div class="modal-header text-white bg-primary">
                                <h5 class="modal-title fw-bold">Detalhes da Liberação #<span th:text="${l.id}"></span></h5>
                                <button type="button" class="btn-close btn-close-white" 
                                        data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>

                            <div class="modal-body row g-3 text-start">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Operador:</label>
                                    <input type="text" class="form-control bg-light" th:value="${l.nomeOp}" readonly>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Equipamento:</label>
                                    <input type="text" class="form-control bg-light" th:value="${l.nomeEquip}" readonly>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold text-muted">Retirada Agendada:</label>
                                    <input type="text" class="form-control bg-light border-primary" 
                                           th:value="${#temporals.format(l.dataHoraRetirada, 'dd/MM/yyyy HH:mm')}" readonly>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold text-muted">Devolução Agendada:</label>
                                    <input type="text" class="form-control bg-light border-primary" 
                                           th:value="${#temporals.format(l.dataHoraDevolucao, 'dd/MM/yyyy HH:mm')}" readonly>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-semibold">Local de Uso:</label>
                                    <input type="text" class="form-control bg-light" th:value="${l.localUso}" readonly>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Horímetro Inicial:</label>
                                    <input type="text" class="form-control bg-light" th:value="${l.horimetroInicial}" readonly>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Combustível Inicial:</label>
                                    <input type="text" class="form-control bg-light" th:value="${l.combustivelInicial}" readonly>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-semibold">Observações de Retirada:</label>
                                    <textarea class="form-control bg-light" rows="2" 
                                              th:text="${l.observacoesRetirada}" readonly></textarea>
                                </div>
                            </div>
                            
                            
                            <!-- PARTE DEVOLUCAO !! depois de dataHoraRetiradaReal -->
                            <div class="col-12 mt-4" th:if="${l.dataHoraRetiradaReal != null}">
                                <form th:action="@{/op/liberacao/close}" method="post" th:id="'formClose' + ${l.id}">
                                    <!-- Hidden fields pra importar valores necessarios -->
                                    <input type="hidden" name="id" th:value="${l.id}">
                                    <input type="hidden" name="idEquip" th:value="${l.idEquip}">
                                    <input type="hidden" name="horimetroInicial" th:value="${l.horimetroInicial}">
                                    <input type="hidden" name="combustivelInicial" th:value="${l.combustivelInicial}">

                                    <div class="row g-3 p-3 bg-white border border-success rounded shadow-sm">
                                        <h6 class="fw-bold text-success mb-0 border-bottom pb-2">
                                            <i class="bi bi-arrow-return-left"></i> Registrar Devolução
                                        </h6>
                                        
                                        <div class="col-md-6">
                                            <label class="form-label fw-semibold">Horímetro Final <span class="text-danger">*</span></label>
                                            <input type="number" step="0.1" class="form-control" name="horimetroFinal" required>
                                        </div>

                                        <div class="col-md-6">
                                            <label class="form-label fw-semibold">Combustível Final (%) <span class="text-danger">*</span></label>
                                            <input type="number" step="5" class="form-control" name="combustivelFinal" required min="0" max="100">
                                        </div>

                                        <!-- toggle alerta  --> 
                                        <div class="col-12 mt-3">
                                            <div class="form-check form-switch">
                                                <input class="form-check-input" type="checkbox" name="alerta" th:id="'alerta' + ${l.id}" value="true">
                                                <label class="form-check-label text-danger fw-bold" th:for="'alerta' + ${l.id}">
                                                    ⚠️ Reportar Problema no Equipamento
                                                </label>
                                            </div>
                                        </div>

                                        <div class="col-12">
                                            <label class="form-label fw-semibold">Observações de Devolução</label>
                                            <textarea class="form-control" name="observacoesDevolucao" rows="2" 
                                                      placeholder="Obrigatório caso reporte um problema"></textarea>
                                        </div>
                                    </div>
                                </form>
                            </div>

                            <!---------------------- BOTOES ---------------------->
                            <div class="modal-footer d-flex justify-content-between">
                                
                                <!-- Deve funcionar dps da data/hora - th:if -->
                                <div th:if="${l.dataHoraRetiradaReal == null}" class="w-100 text-end">
                                    <form th:action="@{/op/liberacao/pickup}" method="post" class="d-inline">
                                        <input type="hidden" name="id" th:value="${l.id}">
                                        <input type="hidden" name="idEquip" th:value="${l.idEquip}">

                                        <button type="submit" 
                                                class="btn btn-outline-success fw-bold px-4"
                                                onclick="return confirm('Confirmar retirada do equipamento?')">
                                            Retirar
                                        </button>
                                    </form>
                                </div>

                                <!-- Deve funcionar dps que aperta retirar -->
                                <!-- th:if horaReal - registro automatico ao retirar -->
                                <div th:if="${l.dataHoraRetiradaReal != null}" class="w-100 d-flex justify-content-end gap-2">
                                    <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Cancelar</button>

                                    <!-- 
                                    * btn type="submit" normalmente precisa estar 
                                      dentro do form pra dar submit correto
                                    * MAS atributo form do HTML5 permite associar qualquer 
                                      botão a qualquer formulário da página pelo th:id="'formClose' + ${l.id}" 
                                      atribuido ao form e th:form="'formClose' + ${l.id}" atribuido ao botao
                                    -->
                                    <button type="submit" 
                                            class="btn btn-outline-success fw-bold px-4" 
                                            th:form="'formClose' + ${l.id}"
                                            onclick="return confirm(
                                                        'Deseja encerrar a liberação e registrar os dados?')">
                                        Devolver
                                    </button>
                                </div>
                                
                            </div>
                        </div>
                    </div>
                </div>
            </th:block>

        </main>
    </body>
</html>
